{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}অভিযোগ | Mess Manager{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl">
    <h1 class="mb-6 text-2xl font-bold">নতুন অভিযোগ / New Complaint</h1>
    <form method="post" class="space-y-4 rounded-lg bg-white p-6 shadow-sm">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="rounded bg-teal-700 px-4 py-2 font-medium text-white hover:bg-teal-600" type="submit">জমা দিন / Submit</button>
    </form>
</div>
{% endblock %}
